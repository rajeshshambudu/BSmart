<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSmart | SuperApp Elite Pro+</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg:#0f172a;--card-bg:#1e293b;--accent:#38bdf8;--text-main:#f1f5f9;
  --text-dim:#94a3b8;--border:rgba(255,255,255,0.1);--nav-bg:#020617;
  --btn-grad:linear-gradient(135deg,#38bdf8 0%,#0ea5e9 100%);
  --danger: #ef4444; --success: #22c55e; --star: #f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;outline:none;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-main);line-height:1.6;padding-bottom:100px;overflow-x:hidden;}

/* Notifications */
#notification-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { background: var(--card-bg); color: white; padding: 15px 20px; border-radius: 12px; border-left: 4px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; min-width: 280px; animation: slideIn 0.3s ease forwards; pointer-events: auto; }
.toast.success { border-left-color: var(--success); }
.toast.danger { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--star); }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { to { transform: translateY(-20px); opacity: 0; } }

/* Navigation */
nav{background:var(--nav-bg);padding:15px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border);}
.logo{font-weight:800;font-size:1.6rem;color:white;text-decoration:none;}
.logo span{color:var(--accent);}

.sub-nav{background:#1e293b;padding:12px 5%;display:flex;align-items:center;gap:15px;overflow-x:auto;position:sticky;top:65px;z-index:999;}
.search-container{flex-grow:1;max-width:400px;display:flex;position:relative;}
.search-container input{width:100%;padding:10px 45px 10px 15px;border-radius:25px;border:none;background:#334155;color:white;}

/* Product Grid */
.container{max-width:1200px;margin:30px auto;padding:0 20px;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px;}
.product-card{background:var(--card-bg);padding:20px;border-radius:20px;border:1px solid var(--border);transition:0.3s;display:flex;flex-direction:column;}
.product-card img{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:15px;}

.rating{color: var(--star); font-size: 0.8rem; margin-bottom: 5px; cursor: pointer;}
.price{font-size: 1.4rem; font-weight: 800; color: var(--accent);}
.btn-buy{background:var(--btn-grad);border:none;color:white;width:100%;padding:12px;border-radius:12px;cursor:pointer;font-weight:600;margin-top:auto;}
.btn-delete{background:transparent; color:var(--danger); border:1px solid var(--danger); padding:5px 10px; border-radius:8px; cursor:pointer;}

/* Modals */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:5000;backdrop-filter:blur(8px);}
.modal-content{background:var(--card-bg);width:90%;max-width:450px;padding:30px;border-radius:20px;max-height: 85vh; overflow-y: auto;}

/* Mobile Nav */
.mobile-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--nav-bg);display:flex;justify-content:space-around;padding:15px;border-top:1px solid var(--border);z-index:4000;}
.mobile-nav a{color:var(--text-dim);text-decoration:none;font-size:0.7rem;text-align:center; cursor:pointer;}
.mobile-nav i{font-size:1.2rem;display:block;margin-bottom:4px;}

input, select, textarea { width:100%; padding:12px; border-radius:8px; border:none; background:#334155; color:white; margin-top:10px; font-family: inherit; }
.stat-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
</style>
</head>
<body>

<div id="notification-container"></div>

<nav>
  <a href="#" class="logo">B<span>SMART</span></a>
  <div style="display:flex;gap:15px;align-items:center;">
    <select id="currencySelector" onchange="updateCurrency()" style="width:auto; padding:5px; margin:0;">
      <option value="USD">USD ($)</option>
      <option value="INR">INR (₹)</option>
    </select>
    <div onclick="toggleModal('cartModal')" style="cursor:pointer;position:relative;">
      <i class="fas fa-shopping-bag" style="font-size:1.3rem;"></i>
      <span id="cart-qty" style="position:absolute;top:-8px;right:-10px;background:red;color:white;padding:2px 5px;border-radius:50%;font-size:9px;">0</span>
    </div>
  </div>
</nav>

<div class="sub-nav">
  <div class="search-container">
    <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search BSmart...">
  </div>
  <button class="cat-btn active" onclick="filterByCategory('all', this)">All</button>
  <button class="cat-btn" onclick="filterByCategory('Cloud', this)">Cloud</button>
</div>

<div class="container">
  <div class="product-grid" id="productGrid"></div>
</div>

<div id="cartModal" class="modal-overlay">
  <div class="modal-content">
    <h2>Your Bag</h2>
    <div id="cartItems" style="margin:20px 0;"></div>
    <div style="display:flex;justify-content:space-between;font-weight:800;border-top:1px solid var(--border);padding-top:10px;">
      <span>Total:</span><span id="cartTotalText">$0.00</span>
    </div>
    <button class="btn-buy" style="margin-top:20px;" onclick="checkoutCart()">Proceed to Checkout</button>
    <button onclick="toggleModal('cartModal')" style="background:none;border:none;color:var(--text-dim);width:100%;margin-top:10px;">Close</button>
  </div>
</div>

<div id="dashboardModal" class="modal-overlay">
  <div class="modal-content">
    <h2>Admin Dashboard</h2>
    <button onclick="exportToCSV()" class="btn-buy" style="background:var(--success); margin-bottom:15px;">
      <i class="fas fa-file-excel"></i> Export Sales to Excel
    </button>
    <div id="dashStats"></div>
    <button onclick="toggleModal('dashboardModal')" class="btn-buy" style="margin-top:20px;">Close</button>
  </div>
</div>

<div id="checkoutModal" class="modal-overlay">
  <div class="modal-content" style="text-align:center;">
    <h2>Payment Confirmation</h2>
    <div id="upiQRContainer" style="margin:20px 0;"></div>
    <div id="checkoutDetails" style="text-align:left; font-size:0.8rem; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px;"></div>
    <button class="btn-buy" style="margin-top:15px;" onclick="confirmCartPayment()">Send WhatsApp Receipt</button>
    <button onclick="toggleModal('checkoutModal')" style="background:none;border:none;color:var(--text-dim);width:100%;margin-top:10px;">Cancel</button>
  </div>
</div>

<div id="profileModal" class="modal-overlay">
  <div class="modal-content">
    <h2>My Profile</h2>
    <input type="text" id="profName" placeholder="Full Name">
    <textarea id="profAddress" placeholder="Delivery Address"></textarea>
    <button onclick="saveProfile()" class="btn-buy" style="margin-top:20px;">Save Profile</button>
  </div>
</div>

<div class="mobile-nav">
  <a onclick="window.scrollTo(0,0)"><i class="fas fa-home"></i>Shop</a>
  <a onclick="toggleModal('cartModal')"><i class="fas fa-shopping-bag"></i>Bag</a>
  <a onclick="toggleModal('profileModal')"><i class="fas fa-user-circle"></i>Profile</a>
  <a onclick="openDashboard()"><i class="fas fa-chart-line"></i>Admin</a>
</div>

<script>
const exchangeRate = 83.5;
const myNumber = "917093218658";
let cart = [];

const products = [
  { id: '101', name: 'Cloud Server (Pro)', category: 'Cloud', price: 199, rating: 5, img: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400', stock: 5 },
  { id: '102', name: 'DevOps Bundle', category: 'Cloud', price: 299, rating: 4, img: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc48?w=400', stock: 2 },
  { id: '103', name: 'Wireless Pro Pods', category: 'Electronics', price: 149, rating: 4, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400', stock: 10 }
];

function showToast(msg, type='success') {
  const container = document.getElementById('notification-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas fa-info-circle"></i><div>${msg}</div>`;
  container.appendChild(t);
  setTimeout(() => { t.style.animation = 'fadeOut 0.5s forwards'; setTimeout(()=>t.remove(),500); }, 3000);
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = products.map(p => `
    <div class="product-card" data-category="${p.category}">
      <img src="${p.img}">
      <div class="rating" onclick="rateProduct('${p.id}')">
        ${Array(5).fill().map((_, i) => `<i class="${i < p.rating ? 'fas' : 'far'} fa-star"></i>`).join('')}
      </div>
      <div style="font-size:0.7rem;">${p.stock} units available</div>
      <h3>${p.name}</h3>
      <div class="price">${formatPrice(p.price)}</div>
      <button class="btn-buy" onclick="addToCart('${p.id}')" ${p.stock===0?'disabled':''}>Add to Bag</button>
    </div>
  `).join('');
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  if(p.stock > 0) {
    p.stock--; cart.push({...p});
    showToast(`${p.name} added!`);
    updateCartUI(); renderProducts();
  }
}

function removeFromCart(idx) {
  const item = cart[idx];
  products.find(x => x.id === item.id).stock++;
  cart.splice(idx, 1);
  updateCartUI(); renderProducts();
}

function updateCartUI() {
  const div = document.getElementById('cartItems');
  let total = cart.reduce((s, i) => s + i.price, 0);
  div.innerHTML = cart.map((item, i) => `
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <span>${item.name}</span>
      <button class="btn-delete" onclick="removeFromCart(${i})"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');
  document.getElementById('cartTotalText').innerText = formatPrice(total);
  document.getElementById('cart-qty').innerText = cart.length;
}

function checkoutCart() {
  const user = JSON.parse(localStorage.getItem('bsmart_user') || '{}');
  if(!user.name) return toggleModal('profileModal');
  
  const total = cart.reduce((s, i) => s + i.price, 0);
  const upiLink = `upi://pay?pa=7093218658@ybl&am=${(total*exchangeRate).toFixed(2)}&cu=INR`;
  
  document.getElementById('upiQRContainer').innerHTML = `
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiLink)}">
    <a href="${upiLink}" class="btn-buy" style="display:block; text-decoration:none; margin-top:10px;">Pay with UPI App</a>
  `;
  toggleModal('cartModal'); toggleModal('checkoutModal');
}

function confirmCartPayment() {
  const user = JSON.parse(localStorage.getItem('bsmart_user'));
  const sales = JSON.parse(localStorage.getItem('bsmart_sales') || '[]');
  const total = document.getElementById('cartTotalText').innerText;
  
  sales.push({ date: new Date().toLocaleString(), user: user.name, total: total, items: cart.map(i=>i.name).join('; ') });
  localStorage.setItem('bsmart_sales', JSON.stringify(sales));
  
  window.open(`https://wa.me/${myNumber}?text=Order Confirmed: ${total}`, '_blank');
  cart = []; updateCartUI(); toggleModal('checkoutModal');
}

function openDashboard() {
  const sales = JSON.parse(localStorage.getItem('bsmart_sales') || '[]');
  document.getElementById('dashStats').innerHTML = sales.map(s => `
    <div class="stat-card">
      <strong>${s.total}</strong> - ${s.user}<br><small>${s.date}</small>
    </div>
  `).join('');
  toggleModal('dashboardModal');
}

function exportToCSV() {
  const sales = JSON.parse(localStorage.getItem('bsmart_sales') || '[]');
  let csv = "Date,User,Total,Items\n";
  sales.forEach(s => { csv += `"${s.date}","${s.user}","${s.total}","${s.items}"\n`; });
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.setAttribute('href', url);
  a.setAttribute('download', 'BSmart_Sales_Report.csv');
  a.click();
}

function rateProduct(id) {
  const p = products.find(x => x.id === id);
  p.rating = p.rating >= 5 ? 1 : p.rating + 1;
  renderProducts();
  showToast("Rating updated!");
}

function toggleModal(id) { const m = document.getElementById(id); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
function formatPrice(usd) { return document.getElementById('currencySelector').value === 'INR' ? "₹"+(usd*exchangeRate).toFixed(0) : "$"+usd; }
function saveProfile() { localStorage.setItem('bsmart_user', JSON.stringify({name: document.getElementById('profName').value, address: document.getElementById('profAddress').value})); toggleModal('profileModal'); }
function updateCurrency() { renderProducts(); updateCartUI(); }

window.onload = renderProducts;
</script>
</body>
</html>
