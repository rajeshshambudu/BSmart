<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSmart SuperApp | Global Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a; --card-bg: #1e293b; --accent: #38bdf8; --text-main: #f1f5f9;
            --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.1); --nav-bg: #020617;
            --btn-grad: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; padding-bottom: 80px; }
        
        nav { background: var(--nav-bg); padding: 15px 5%; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 800; font-size: 1.6rem; color: white; text-decoration: none; }
        .logo span { color: var(--accent); }
        
        .sub-nav { background: #1e293b; padding: 12px 5%; display: flex; align-items: center; gap: 15px; overflow-x: auto; position: sticky; top: 65px; z-index: 999; }
        .search-container { flex-grow: 1; max-width: 400px; display: flex; position: relative; }
        .search-container input { width: 100%; padding: 10px 45px 10px 15px; border-radius: 25px; border: none; background: #334155; color: white; }
        .voice-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--accent); cursor: pointer; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .product-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--border); transition: 0.3s; position: relative; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        
        .price { font-size: 1.6rem; font-weight: 800; color: var(--accent); margin: 10px 0; }
        .btn-buy { background: var(--btn-grad); border: none; color: white; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .btn-emi { background: transparent; border: 1px solid var(--text-dim); color: var(--text-dim); margin-top: 10px; width: 100%; padding: 10px; border-radius: 12px; cursor: pointer; font-size: 0.8rem; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 5000; backdrop-filter: blur(8px); }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 400px; padding: 35px; border-radius: 25px; position: relative; }
        
        #sales-popup { position: fixed; bottom: 100px; left: -400px; background: var(--card-bg); border: 1px solid var(--accent); padding: 12px; border-radius: 15px; display: flex; align-items: center; gap: 12px; z-index: 4500; transition: 0.6s; }
        .mobile-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--nav-bg); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid var(--border); z-index: 4000; }
        .mobile-nav a { color: var(--text-dim); text-decoration: none; font-size: 0.75rem; text-align: center; }
        .mobile-nav i { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">B<span>SMART</span></a>
    <div style="display: flex; gap: 20px; align-items: center;">
        <select id="currencySelector" onchange="updateCurrency()" style="background: none; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px;">
            <option value="USD">USD</option>
            <option value="INR">INR</option>
        </select>
        <div onclick="toggleModal('cartModal')" style="cursor:pointer; position:relative;">
            <i class="fas fa-shopping-bag" style="font-size: 1.5rem;"></i>
            <span id="cart-qty" style="position:absolute; top:-10px; right:-10px; background:red; color:white; padding:2px 6px; border-radius:50%; font-size:10px;">0</span>
        </div>
    </div>
</nav>

<div class="sub-nav">
    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search anything...">
        <button class="voice-btn" onclick="startVoiceSearch()"><i class="fas fa-microphone" id="mic-icon"></i></button>
    </div>
</div>

<div class="container">
    <div class="product-grid" id="productGrid">
        <div class="product-card" data-category="Electronics">
            <img src="https://images.unsplash.com/photo-1546868871-70c122467dff?w=500">
            <h3>BSmart Watch Pro</h3>
            <div class="price" data-usd="249.00">$249.00</div>
            <button class="btn-buy" onclick="addToCart('Smart Watch Pro', 249)">Add to Bag</button>
        </div>
        <div class="product-card" data-category="Food">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">
            <h3>BSmart Burger</h3>
            <div class="price" data-usd="12.00">$12.00</div>
            <button class="btn-buy" onclick="addToCart('Burger', 12)">Order Now</button>
        </div>
        <div class="product-card" data-category="Vehicles">
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500">
            <h3>Tesla Model X</h3>
            <div class="price" data-usd="80000.00">$80,000.00</div>
            <button class="btn-buy" onclick="buyNow('Tesla Model X')">Inquire Now</button>
            <button class="btn-emi" onclick="openEMITool(80000)">Calculate EMI</button>
        </div>
    </div>
</div>

<div id="cartModal" class="modal-overlay">
    <div class="modal-content">
        <h2>Your Bag</h2>
        <div id="cartItems" style="margin:20px 0;"></div>
        <div style="display:flex; justify-content:space-between; font-weight:800; border-top:1px solid #334155; padding-top:10px;">
            <span>Total:</span><span id="cartTotalText">$0.00</span>
        </div>
        <button class="btn-buy" style="margin-top:20px;" onclick="checkout()">Checkout via WhatsApp</button>
        <button onclick="toggleModal('cartModal')" style="background:none; border:none; color:var(--text-dim); width:100%; margin-top:10px;">Close</button>
    </div>
</div>

<div id="emiModal" class="modal-overlay">
    <div class="modal-content">
        <h2>EMI Calculator</h2>
        <h3 id="monthlyResult" style="text-align:center; padding:20px; background:rgba(56,189,248,0.1); border-radius:15px; margin:20px 0;">$0.00 / mo</h3>
        <button class="btn-buy" onclick="toggleModal('emiModal')">Close</button>
    </div>
</div>

<div id="sales-popup">
    <div id="pop-img" style="width:40px; height:40px; border-radius:5px; background-size:cover;"></div>
    <div><p id="pop-text" style="font-size:0.75rem;"></p></div>
</div>

<div class="mobile-nav">
    <a href="#"><i class="fas fa-home"></i>Shop</a>
    <a href="javascript:void(0)" onclick="toggleModal('cartModal')"><i class="fas fa-shopping-bag"></i>Cart</a>
    <a href="mailto:shambudurajesh05@gmail.com"><i class="fas fa-user"></i>Contact</a>
</div>

<script>
    const exchangeRate = 83.5;
    const myNumber = "917093218658"; // Your Updated Number
    let cart = [];

    function updateCurrency() {
        const currency = document.getElementById('currencySelector').value;
        document.querySelectorAll('.price').forEach(p => {
            const usd = parseFloat(p.dataset.usd);
            p.innerText = currency === 'INR' ? '₹' + (usd * exchangeRate).toLocaleString() : '$' + usd.toFixed(2);
        });
        updateCartUI();
    }

    function addToCart(n, p) {
        cart.push({name: n, price: p});
        document.getElementById('cart-qty').innerText = cart.length;
        updateCartUI();
    }

    function updateCartUI() {
        const currency = document.getElementById('currencySelector').value;
        let total = 0;
        document.getElementById('cartItems').innerHTML = cart.map(i => {
            total += i.price;
            return `<div style="display:flex; justify-content:space-between;"><span>${i.name}</span><span>${currency==='INR'?'₹'+(i.price*exchangeRate).toLocaleString():'$'+i.price}</span></div>`;
        }).join('');
        document.getElementById('cartTotalText').innerText = currency === 'INR' ? '₹'+(total*exchangeRate).toLocaleString() : '$'+total.toFixed(2);
    }

    function checkout() {
        const total = document.getElementById('cartTotalText').innerText;
        const msg = encodeURIComponent(`Hello BSmart! I'd like to order items worth ${total}. Please confirm my order.`);
        window.open(`https://wa.me/${myNumber}?text=${msg}`, '_blank');
    }

    function buyNow(name) {
        window.open(`https://wa.me/${myNumber}?text=I am interested in buying: ${name}`, '_blank');
    }

    function openEMITool(amt) {
        const monthly = amt / 12;
        document.getElementById('monthlyResult').innerText = "$" + monthly.toFixed(2) + " / mo";
        toggleModal('emiModal');
    }

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function filterProducts() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.product-card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }

    function startVoiceSearch() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SpeechRecognition) return;
        const rec = new SpeechRecognition();
        rec.onstart = () => { document.getElementById('mic-icon').style.color = "red"; };
        rec.onresult = (e) => { document.getElementById('searchInput').value = e.results[0][0].transcript; filterProducts(); };
        rec.onend = () => { document.getElementById('mic-icon').style.color = "var(--accent)"; };
        rec.start();
    }
</script>
</body>
</html>
