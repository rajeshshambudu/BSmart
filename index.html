<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSmart Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --accent:#38bdf8;
  --success:#22c55e;
  --text:#f1f5f9;
  --muted:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
}
nav{
  padding:15px 5%;
  background:#020617;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:1.5rem;
  font-weight:800;
}
.logo span{color:var(--accent)}
.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}
.card{
  background:var(--card);
  border-radius:16px;
  padding:15px;
  display:flex;
  flex-direction:column;
}
.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:12px;
}
.price{
  font-size:1.3rem;
  font-weight:800;
  color:var(--accent);
  margin:10px 0;
}
button{
  border:none;
  padding:12px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}
.btn-cart{
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  color:#fff;
}
.btn-buy{
  background:var(--success);
  color:#fff;
  margin-top:8px;
}
footer{
  text-align:center;
  color:var(--muted);
  padding:30px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">B<span>SMART</span></div>
  <select id="currency" onchange="renderProducts()">
    <option value="INR">INR ₹</option>
    <option value="USD">USD $</option>
  </select>
</nav>

<div class="container">
  <div class="grid" id="productGrid"></div>
</div>

<footer>
  Secure UPI Payments • Powered by BSmart
</footer>

<script>
/* ================= CONFIG ================= */
const UPI_ID = "7093218658@ybl";
const UPI_NAME = "BSmart";
const exchangeRate = 83.5;

/* ================= PRODUCTS ================= */
const products = [
  {
    id:"1",
    name:"Cloud Server",
    price:199,
    img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400"
  },
  {
    id:"2",
    name:"DevOps Pack",
    price:299,
    img:"https://images.unsplash.com/photo-1558494949-ef010cbdcc48?w=400"
  }
];

/* ================= RENDER ================= */
function renderProducts(){
  const curr = document.getElementById("currency").value;
  const grid = document.getElementById("productGrid");

  grid.innerHTML = products.map(p=>{
    const displayPrice =
      curr === "INR"
      ? "₹" + Math.round(p.price * exchangeRate)
      : "$" + p.price;

    return `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <div class="price">${displayPrice}</div>

        <button class="btn-cart" onclick="addToBag('${p.id}')">
          Add to Bag
        </button>

        <button class="btn-buy" onclick="buyNow('${p.id}')">
          Buy Now
        </button>
      </div>
    `;
  }).join("");
}

/* ================= CART (OPTIONAL) ================= */
let cart = [];
function addToBag(id){
  const p = products.find(x=>x.id===id);
  cart.push(p);
  alert("Added to Bag");
}

/* ================= UPI BUY NOW ================= */
function buyNow(id){
  const p = products.find(x=>x.id===id);
  const curr = document.getElementById("currency").value;

  const amount =
    curr === "INR"
    ? Math.round(p.price * exchangeRate)
    : p.price;

  const upiUrl =
    `upi://pay?pa=${UPI_ID}` +
    `&pn=${encodeURIComponent(UPI_NAME)}` +
    `&am=${amount}` +
    `&cu=INR` +
    `&tn=${encodeURIComponent("Purchase: "+p.name)}`;

  window.location.href = upiUrl;
}

renderProducts();
</script>

</body>
</html>
