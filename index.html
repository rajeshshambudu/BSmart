<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSmart | Secure Master App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg:#0f172a;--card-bg:#1e293b;--accent:#38bdf8;--text-main:#f1f5f9;
  --text-dim:#94a3b8;--border:rgba(255,255,255,0.1);--nav-bg:#020617;
  --btn-grad:linear-gradient(135deg,#38bdf8 0%,#0ea5e9 100%);
  --danger: #ef4444; --success: #22c55e; --star: #f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;outline:none;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-main);line-height:1.6;padding-bottom:100px;overflow-x:hidden;}

/* Notifications */
#notification-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { background: var(--card-bg); color: white; padding: 15px 20px; border-radius: 12px; border-left: 4px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; animation: slideIn 0.3s ease forwards; pointer-events: auto; }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { to { transform: translateY(-20px); opacity: 0; } }

/* Layout */
nav{background:var(--nav-bg);padding:15px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border);}
.logo{font-weight:800;font-size:1.6rem;color:white;text-decoration:none;}
.logo span{color:var(--accent);}

.container{max-width:1200px;margin:30px auto;padding:0 20px;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
.product-card{background:var(--card-bg);padding:15px;border-radius:20px;border:1px solid var(--border);transition:0.3s;display:flex;flex-direction:column;}
.product-card img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px;}

/* Modals */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:5000;backdrop-filter:blur(8px);}
.modal-content{background:var(--card-bg);width:95%;max-width:500px;padding:25px;border-radius:20px;max-height: 90vh; overflow-y: auto;}

.btn-buy{background:var(--btn-grad);border:none;color:white;width:100%;padding:12px;border-radius:12px;cursor:pointer;font-weight:600;margin-top:auto;}
.stat-card { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid var(--accent); }

/* Form Elements */
input, textarea, select { width:100%; padding:12px; border-radius:8px; border:none; background:#334155; color:white; margin-top:8px; font-family:inherit;}
.mobile-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--nav-bg);display:flex;justify-content:space-around;padding:12px;border-top:1px solid var(--border);z-index:4000;}
.mobile-nav a{color:var(--text-dim);text-decoration:none;font-size:0.7rem;text-align:center; cursor:pointer;}
.mobile-nav i{font-size:1.2rem;display:block;margin-bottom:2px;}

.admin-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; margin-bottom: 5px; font-size: 0.8rem; }
</style>
</head>
<body>

<div id="notification-container"></div>

<nav>
  <a href="#" class="logo">B<span>SMART</span></a>
  <select id="currencySelector" onchange="renderProducts()" style="width:auto; margin:0; padding:5px;">
    <option value="USD">USD ($)</option>
    <option value="INR">INR (₹)</option>
  </select>
</nav>

<div class="container">
  <div class="product-grid" id="productGrid"></div>
</div>

<div id="dashboardModal" class="modal-overlay">
  <div class="modal-content">
    <h2 style="color:var(--accent);">Admin Panel <i class="fas fa-lock-open"></i></h2>
    
    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; margin:15px 0;">
      <h4 style="margin-bottom:10px;">Add New Product</h4>
      <input type="text" id="newPName" placeholder="Product Name">
      <input type="number" id="newPPrice" placeholder="Price (USD)">
      <input type="text" id="newPImg" placeholder="Image URL">
      <button onclick="addNewProduct()" class="btn-buy" style="background:var(--success);">Create Product</button>
    </div>

    <h4 style="margin:15px 0 5px;">Manage Inventory</h4>
    <div id="inventoryList" style="max-height:150px; overflow-y:auto; margin-bottom:20px;"></div>

    <div id="adminSummary" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;"></div>
    
    <button onclick="exportToCSV()" class="btn-buy" style="background:#4834d4; margin-bottom:10px;">Download Sales CSV</button>
    <button onclick="toggleModal('dashboardModal')" class="btn-buy">Exit Admin</button>
  </div>
</div>

<div id="cartModal" class="modal-overlay">
  <div class="modal-content">
    <h2>Your Bag</h2>
    <div id="cartItems" style="margin:20px 0;"></div>
    <div style="display:flex;justify-content:space-between;font-weight:800; border-top:1px solid var(--border); padding-top:10px;">
      <span>Total:</span><span id="cartTotalText">$0.00</span>
    </div>
    <button class="btn-buy" onclick="checkoutCart()">Secure UPI Payment</button>
  </div>
</div>

<div id="profileModal" class="modal-overlay">
  <div class="modal-content">
    <h2>Delivery Profile</h2>
    <input type="text" id="profName" placeholder="Full Name">
    <textarea id="profAddress" placeholder="Full Address" rows="3"></textarea>
    <button onclick="saveProfile()" class="btn-buy">Save Settings</button>
  </div>
</div>

<div class="mobile-nav">
  <a onclick="window.scrollTo(0,0)"><i class="fas fa-store"></i>Shop</a>
  <a onclick="toggleModal('cartModal')"><i class="fas fa-shopping-bag"></i>Bag</a>
  <a onclick="toggleModal('profileModal')"><i class="fas fa-user-circle"></i>Profile</a>
  <a onclick="secureAdmin()"><i class="fas fa-user-shield"></i>Admin</a>
</div>

<script>
const exchangeRate = 83.5;
const myNumber = "917093218658";
const ADMIN_PASS = "1234"; // CHANGE THIS PASSCODE
let cart = [];

let products = JSON.parse(localStorage.getItem('bsmart_inventory')) || [
  { id: '1', name: 'Cloud Server', price: 199, img: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400', stock: 10 },
  { id: '2', name: 'DevOps Pack', price: 299, img: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc48?w=400', stock: 5 }
];

function secureAdmin() {
  const code = prompt("Enter Admin Passcode:");
  if(code === ADMIN_PASS) {
    openDashboard();
  } else {
    alert("Access Denied: Incorrect Passcode");
  }
}

function showToast(msg) {
  const c = document.getElementById('notification-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i class="fas fa-check-circle" style="color:var(--success)"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(() => { t.style.animation = 'fadeOut 0.5s forwards'; setTimeout(()=>t.remove(),500); }, 2500);
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  const curr = document.getElementById('currencySelector').value;
  grid.innerHTML = products.map(p => `
    <div class="product-card">
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <div style="font-size:0.7rem; color:var(--text-dim);">Available: ${p.stock}</div>
      <div style="color:var(--accent); font-weight:800; font-size:1.2rem; margin:10px 0;">
        ${curr==='INR'?'₹'+(p.price*exchangeRate).toFixed(0):'$'+p.price}
      </div>
      <button class="btn-buy" onclick="addToCart('${p.id}')" ${p.stock===0?'disabled':''}>Add to Bag</button>
    </div>
  `).join('');
}

function addNewProduct() {
  const name = document.getElementById('newPName').value;
  const price = document.getElementById('newPPrice').value;
  const img = document.getElementById('newPImg').value || 'https://via.placeholder.com/150';
  
  if(!name || !price) return showToast("Name and Price required!");
  
  products.push({ id: Date.now().toString(), name, price: parseFloat(price), img, stock: 10 });
  syncAndRender();
  document.getElementById('newPName').value = '';
  document.getElementById('newPPrice').value = '';
  showToast("Product Added!");
  openDashboard(); // Refresh dash list
}

function deleteProduct(id) {
  if(confirm("Permanently delete this product?")) {
    products = products.filter(p => p.id !== id);
    syncAndRender();
    openDashboard();
  }
}

function syncAndRender() {
  localStorage.setItem('bsmart_inventory', JSON.stringify(products));
  renderProducts();
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  if(p.stock > 0) {
    p.stock--; cart.push({...p});
    updateCartUI(); renderProducts();
    showToast("Bag Updated");
  }
}

function updateCartUI() {
  const curr = document.getElementById('currencySelector').value;
  let total = cart.reduce((s, i) => s + i.price, 0);
  document.getElementById('cartTotalText').innerText = curr==='INR'?'₹'+(total*exchangeRate).toFixed(0):'$'+total;
  document.getElementById('cart-qty').innerText = cart.length;
  document.getElementById('cartItems').innerHTML = cart.map((item, i) => `
    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
      <span>${item.name}</span>
      <button onclick="removeFromCart(${i})" style="color:var(--danger); background:none; border:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
    </div>`).join('');
}

function removeFromCart(idx) {
  products.find(x => x.id === cart[idx].id).stock++;
  cart.splice(idx, 1); updateCartUI(); renderProducts();
}

function checkoutCart() {
  const user = JSON.parse(localStorage.getItem('bsmart_user') || '{}');
  if(!user.name) return toggleModal('profileModal');
  
  const totalDisplay = document.getElementById('cartTotalText').innerText;
  const sales = JSON.parse(localStorage.getItem('bsmart_sales') || '[]');
  sales.push({ date: new Date().toLocaleString(), user: user.name, total: totalDisplay, items: cart.map(i=>i.name).join(', ') });
  localStorage.setItem('bsmart_sales', JSON.stringify(sales));
  
  window.open(`https://wa.me/${myNumber}?text=Secure Order from ${user.name}: ${totalDisplay}`, '_blank');
  cart = []; updateCartUI(); toggleModal('cartModal');
  showToast("Order Dispatched!");
}

function openDashboard() {
  const sales = JSON.parse(localStorage.getItem('bsmart_sales') || '[]');
  
  document.getElementById('adminSummary').innerHTML = `
    <div class="stat-card"><h3>${sales.length}</h3><small>Total Sales</small></div>
    <div class="stat-card"><h3>${products.length}</h3><small>Products</small></div>
  `;
  
  // Render Inventory for deletion
  document.getElementById('inventoryList').innerHTML = products.map(p => `
    <div class="admin-item">
      <span>${p.name}</span>
      <button onclick="deleteProduct('${p.id}')" style="color:var(--danger); background:none; border:none; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>
    </div>
  `).join('');
  
  toggleModal('dashboardModal');
}

function exportToCSV() {
  const sales = JSON.parse(localStorage.getItem('bsmart_sales') || '[]');
  let csv = "Date,User,Total,Items\n" + sales.map(s => `"${s.date}","${s.user}","${s.total}","${s.items}"`).join("\n");
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'BSmart_Report.csv';
  a.click();
}

function toggleModal(id) { const m = document.getElementById(id); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
function saveProfile() { localStorage.setItem('bsmart_user', JSON.stringify({name: document.getElementById('profName').value, address: document.getElementById('profAddress').value})); toggleModal('profileModal'); showToast("Profile Securely Saved"); }

window.onload = renderProducts;
</script>
</body>
</html>
