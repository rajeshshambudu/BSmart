<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSmart | Ultimate SuperApp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg:#0f172a;--card-bg:#1e293b;--accent:#38bdf8;--text-main:#f1f5f9;
  --text-dim:#94a3b8;--border:rgba(255,255,255,0.1);--nav-bg:#020617;
  --btn-grad:linear-gradient(135deg,#38bdf8 0%,#0ea5e9 100%);
  --danger: #ef4444; --success: #22c55e; --gold: #f59e0b;
}
.light-mode {
  --bg:#f8fafc;--card-bg:#ffffff;--accent:#0284c7;--text-main:#1e293b;
  --text-dim:#64748b;--border:rgba(0,0,0,0.1);--nav-bg:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;transition: background 0.3s, color 0.3s;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-main);padding-bottom:100px;}
nav{background:var(--nav-bg);padding:15px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border);}
.logo{font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--text-main);}
.logo span{color:var(--accent);}
.sub-nav{background:var(--card-bg);padding:12px 5%;display:flex;align-items:center;gap:12px;overflow-x:auto;position:sticky;top:60px;z-index:999;border-bottom:1px solid var(--border);}
.search-container{flex-grow:1;max-width:400px;display:flex;position:relative;}
.search-container input{width:100%;padding:10px 40px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text-main);}
.container{max-width:1200px;margin:20px auto;padding:0 15px;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
.product-card{background:var(--card-bg);padding:15px;border-radius:20px;border:1px solid var(--border);display:flex;flex-direction:column;position:relative;}
.product-card img{width:100%;height:160px;object-fit:cover;border-radius:15px;margin-bottom:12px;}
.btn-buy{background:var(--btn-grad);border:none;color:white;padding:12px;border-radius:12px;cursor:pointer;font-weight:600;margin-top:auto;}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:5000;backdrop-filter:blur(5px);}
.modal-content{background:var(--card-bg);width:90%;max-width:400px;padding:25px;border-radius:25px;max-height:85vh;overflow-y:auto;}
.mobile-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--nav-bg);display:flex;justify-content:space-around;padding:12px;border-top:1px solid var(--border);z-index:4000;}
.mobile-nav a{color:var(--text-dim);text-decoration:none;font-size:0.65rem;text-align:center;}

/* Chat Widget Styles */
.chat-widget { position: fixed; bottom: 85px; right: 20px; z-index: 6000; }
.chat-btn { width: 55px; height: 55px; background: var(--btn-grad); border-radius: 50%; display: flex; align-items:center; justify-content:center; color:white; font-size: 1.5rem; cursor:pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: pulse 2s infinite; }
.chat-window { position: absolute; bottom: 70px; right: 0; width: 300px; background: var(--card-bg); border-radius: 15px; border: 1px solid var(--border); display: none; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.chat-header { background: var(--nav-bg); padding: 15px; color: var(--accent); font-weight: 800; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
.chat-body { padding: 15px; height: 250px; overflow-y: auto; font-size: 0.85rem; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; }
.msg.bot { background: var(--bg); color: var(--text-main); align-self: flex-start; }
.chat-footer { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 5px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(56, 189, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }
</style>
</head>
<body>

<nav>
  <a href="#" class="logo">B<span>SMART</span></a>
  <div style="display:flex;gap:12px;align-items:center;">
    <button onclick="toggleTheme()" style="background:none;border:none;color:var(--text-main);cursor:pointer;"><i class="fas fa-adjust"></i></button>
    <div onclick="toggleModal('cartModal')" style="cursor:pointer;position:relative;">
      <i class="fas fa-shopping-bag"></i>
      <span id="cart-qty" style="position:absolute;top:-8px;right:-8px;background:var(--danger);color:white;padding:2px 5px;border-radius:50%;font-size:8px;">0</span>
    </div>
  </div>
</nav>

<div class="sub-nav">
  <div class="search-container">
    <i class="fas fa-search" style="position:absolute;left:15px;top:12px;color:var(--text-dim);font-size:0.8rem;"></i>
    <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search gadgets...">
  </div>
</div>

<div class="container">
  <div class="product-grid" id="productGrid"></div>
</div>

<div class="chat-widget">
  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <span>BSmart Support</span>
      <i class="fas fa-times" onclick="toggleChat()" style="cursor:pointer;"></i>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="msg bot">👋 Hello! How can we help you today?</div>
    </div>
    <div class="chat-footer">
      <button onclick="window.open('https://wa.me/917093218658')" style="width:100%; padding:8px; border-radius:8px; border:none; background:#25D366; color:white; font-weight:bold; cursor:pointer;">
        <i class="fab fa-whatsapp"></i> Chat on WhatsApp
      </button>
    </div>
  </div>
  <div class="chat-btn" onclick="toggleChat()">
    <i class="fas fa-comment-dots"></i>
  </div>
</div>

<div id="cartModal" class="modal-overlay">
  <div class="modal-content">
    <h3>My Bag</h3>
    <div id="cartItems" style="margin:20px 0;"></div>
    <button class="btn-buy" style="width:100%;" onclick="checkoutCart()">Proceed to Pay</button>
    <button onclick="toggleModal('cartModal')" style="background:none;border:none;color:var(--text-dim);width:100%;margin-top:15px;">Close</button>
  </div>
</div>

<div class="mobile-nav">
  <a href="#"><i class="fas fa-th-large"></i>Shop</a>
  <a href="javascript:void(0)" onclick="toggleModal('cartModal')"><i class="fas fa-shopping-cart"></i>Bag</a>
  <a href="javascript:void(0)" onclick="toggleModal('profileModal')"><i class="fas fa-user-circle"></i>Profile</a>
</div>

<script>
const products = [
  { id: '1', name: 'Cloud Server', category: 'Cloud', price: 150, img: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=400', stock: 5 },
  { id: '2', name: 'Beats Solo', category: 'Electronics', price: 299, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400', stock: 2 }
];
let cart = [];

function renderProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = products.map(p => `
    <div class="product-card">
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <div style="color:var(--accent); font-weight:800; margin-bottom:10px;">$${p.price}</div>
      <button class="btn-buy" onclick="addToCart('${p.id}')">Add to Bag</button>
    </div>
  `).join('');
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  cart.push(p);
  document.getElementById('cart-qty').innerText = cart.length;
  updateCartUI();
}

function updateCartUI() {
  const cartDiv = document.getElementById('cartItems');
  cartDiv.innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${i.name}</span><span>$${i.price}</span></div>`).join('');
}

function toggleChat() {
  const win = document.getElementById('chatWindow');
  win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
}

function toggleTheme() { document.body.classList.toggle('light-mode'); }
function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display==='flex') ? 'none' : 'flex'; }

window.onload = renderProducts;
</script>
</body>
</html>
