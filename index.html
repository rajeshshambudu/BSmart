<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSmart | Elite Master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg:#0f172a;--card-bg:#1e293b;--accent:#38bdf8;--text-main:#f1f5f9;
  --text-dim:#94a3b8;--border:rgba(255,255,255,0.1);--nav-bg:#020617;
  --btn-grad:linear-gradient(135deg,#38bdf8 0%,#0ea5e9 100%);
  --danger: #ef4444; --success: #22c55e;
}
*{margin:0;padding:0;box-sizing:border-box;outline:none;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-main);padding-bottom:100px;}

/* Notifications */
#notification-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { background: var(--card-bg); color: white; padding: 15px 20px; border-radius: 12px; border-left: 4px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: slideIn 0.3s ease forwards; pointer-events: auto; }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Layout */
nav{background:var(--nav-bg);padding:15px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border);}
.logo{font-weight:800;font-size:1.6rem;color:white;text-decoration:none;}
.logo span{color:var(--accent);}

.container{max-width:1200px;margin:30px auto;padding:0 20px;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
.product-card{background:var(--card-bg);padding:15px;border-radius:20px;border:1px solid var(--border); transition: 0.3s;}
.product-card:hover { border-color: var(--accent); }
.product-card img{width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px; background: #000;}

/* Modals */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:5000;backdrop-filter:blur(8px);}
.modal-content{background:var(--card-bg);width:95%;max-width:450px;padding:25px;border-radius:20px;max-height: 90vh; overflow-y: auto;}

.btn-buy{background:var(--btn-grad);border:none;color:white;width:100%;padding:12px;border-radius:12px;cursor:pointer;font-weight:600;margin-top:10px;}
input, textarea { width:100%; padding:12px; border-radius:8px; border:none; background:#334155; color:white; margin-top:8px; font-family:inherit;}

.mobile-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--nav-bg);display:flex;justify-content:space-around;padding:12px;border-top:1px solid var(--border);z-index:4000;}
.mobile-nav a{color:var(--text-dim);text-decoration:none;font-size:0.7rem;text-align:center; cursor:pointer;}
.mobile-nav i{font-size:1.2rem;display:block;margin-bottom:2px;}
</style>
</head>
<body>

<div id="notification-container"></div>

<nav>
  <a href="#" class="logo">B<span>SMART</span></a>
  <div style="font-size: 0.8rem; border: 1px solid var(--border); padding: 5px 10px; border-radius: 20px;">
    <span id="cart-qty">0</span> Items in Bag
  </div>
</nav>

<div class="container">
  <div class="product-grid" id="productGrid"></div>
</div>

<div id="dashboardModal" class="modal-overlay">
  <div class="modal-content">
    <h2 style="color:var(--accent);">Admin Dashboard</h2>
    
    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; margin:15px 0;">
      <h4 style="margin-bottom:5px;">Add New Product</h4>
      <input type="text" id="newPName" placeholder="Product Name (e.g. iPhone 15)">
      <input type="number" id="newPPrice" placeholder="Price in USD (e.g. 999)">
      <input type="text" id="newPImg" placeholder="Paste Direct Image URL here...">
      
      <div id="imagePreview" style="width:100%; height:80px; border:1px dashed var(--border); border-radius:10px; margin-top:10px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
        <span style="font-size:0.6rem; color:var(--text-dim);">Image Preview</span>
      </div>

      <button onclick="addNewProduct()" class="btn-buy" style="background:var(--success);">Save Product</button>
    </div>

    <div id="inventoryList" style="margin-bottom:20px;"></div>
    <button onclick="toggleModal('dashboardModal')" class="btn-buy">Close Admin</button>
  </div>
</div>

<div id="cartModal" class="modal-overlay">
  <div class="modal-content">
    <h2>Your Bag</h2>
    <div id="cartItems" style="margin:20px 0;"></div>
    <div style="font-weight:800; border-top:1px solid var(--border); padding-top:10px;">Total: <span id="cartTotalText">$0.00</span></div>
    <button class="btn-buy" onclick="checkoutCart()">Complete Order</button>
  </div>
</div>

<div class="mobile-nav">
  <a onclick="window.scrollTo(0,0)"><i class="fas fa-store"></i>Shop</a>
  <a onclick="toggleModal('cartModal')"><i class="fas fa-shopping-bag"></i>Bag</a>
  <a onclick="secureAdmin()"><i class="fas fa-user-shield"></i>Admin</a>
</div>

<script>
const ADMIN_PASS = "1234";
const myNumber = "917093218658";
let cart = [];
let products = JSON.parse(localStorage.getItem('bsmart_inventory')) || [
  { id: '1', name: 'Cloud Server', price: 199, img: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc48?w=500', stock: 10 },
  { id: '2', name: 'Elite Watch', price: 299, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500', stock: 5 }
];

function secureAdmin() {
  if(prompt("Enter Admin Passcode:") === ADMIN_PASS) { openDashboard(); } 
  else { alert("Wrong Passcode"); }
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = products.map(p => `
    <div class="product-card">
      <img src="${p.img}" onerror="this.src='https://placehold.co/400x250/1e293b/38bdf8?text=Image+Loading...'">
      <h3>${p.name}</h3>
      <div style="color:var(--accent); font-weight:800; font-size:1.2rem; margin:10px 0;">$${p.price}</div>
      <button class="btn-buy" onclick="addToCart('${p.id}')">Add to Bag</button>
    </div>
  `).join('');
}

// Live Preview Logic
document.getElementById('newPImg').addEventListener('input', (e) => {
  const preview = document.getElementById('imagePreview');
  if(e.target.value) {
    preview.innerHTML = `<img src="${e.target.value}" style="height:100%;" onerror="this.src='https://placehold.co/100?text=Invalid+Link'">`;
  }
});

function addNewProduct() {
  const name = document.getElementById('newPName').value;
  const price = document.getElementById('newPPrice').value;
  let img = document.getElementById('newPImg').value || 'https://placehold.co/400x250/1e293b/38bdf8?text=BSmart';

  if(!name || !price) return alert("Fill Name and Price");

  products.push({ id: Date.now().toString(), name, price: parseFloat(price), img, stock: 10 });
  localStorage.setItem('bsmart_inventory', JSON.stringify(products));
  
  document.getElementById('newPName').value = '';
  document.getElementById('newPPrice').value = '';
  document.getElementById('newPImg').value = '';
  renderProducts();
  toggleModal('dashboardModal');
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  cart.push({...p});
  updateCartUI();
  showToast(`${p.name} added!`);
}

function updateCartUI() {
  let total = cart.reduce((s, i) => s + i.price, 0);
  document.getElementById('cartTotalText').innerText = "$" + total;
  document.getElementById('cart-qty').innerText = cart.length;
  document.getElementById('cartItems').innerHTML = cart.map((item, i) => `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${item.name}</span><b>$${item.price}</b></div>`).join('');
}

function checkoutCart() {
  window.open(`https://wa.me/${myNumber}?text=New Order: ${cart.length} items`, '_blank');
  cart = []; updateCartUI(); toggleModal('cartModal');
}

function showToast(msg) {
  const c = document.getElementById('notification-container');
  const t = document.createElement('div');
  t.className = 'toast'; t.innerText = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function openDashboard() { toggleModal('dashboardModal'); }
function toggleModal(id) { const m = document.getElementById(id); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }

window.onload = renderProducts;
</script>
</body>
</html>
