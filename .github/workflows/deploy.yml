name: Deploy BSmart App
on:
  push:
    branches: ["main"] # Deploys automatically whenever you push code

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Tells GitHub to deploy the folder containing index.html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
